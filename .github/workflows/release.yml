name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create tags, releases, and push the version-bump commit.
permissions:
  contents: write

# Only one release run at a time. If a second push lands while a release is
# in progress, queue it — don't cancel. When the queued run starts it will
# find no unreleased commits (the tag was already created) and exit early.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The version-bump commit is pushed with RELEASE_TOKEN (an admin PAT that
    # bypasses main's PR ruleset), and PAT pushes — unlike the default
    # GITHUB_TOKEN — DO re-trigger push workflows. This guard stops the bump
    # commit from releasing itself in a loop; the script's "no unreleased
    # commits" early exit is the backstop.
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is required to find the previous release tag.
          fetch-depth: 0
          # RELEASE_TOKEN so the bump commit bypasses the PR ruleset and the
          # tag push triggers publish.yml (GITHUB_TOKEN pushes would not).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release if there are unreleased changes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          chmod +x .github/scripts/release.sh .github/scripts/next-version.sh
          .github/scripts/release.sh
