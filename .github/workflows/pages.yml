name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble site
        run: |
          mkdir -p _dist/styles
          cp -r site/* _dist/
          cp styles/manifest.json styles/all.css _dist/styles/
          for d in styles/*/; do
            [ "$(basename "$d")" = "test" ] && continue
            cp -r "$d" "_dist/styles/$(basename "$d")"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _dist
      - id: deployment
        uses: actions/deploy-pages@v4
